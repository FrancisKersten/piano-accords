
name: MUS-001 - Publier la derniere version ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Choisir et extraire MUS-001
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import shutil
          import zipfile
          from pathlib import Path

          prefix = 'MUS-001'
          pattern = re.compile(r'^MUS-001_v([0-9]{3})(?:_[A-Za-z0-9][A-Za-z0-9._-]*)?\.zip$', re.IGNORECASE)
          candidates = []
          for path in Path('.').iterdir():
              if path.is_file():
                  match = pattern.fullmatch(path.name)
                  if match:
                      candidates.append((int(match.group(1)), path))
          if not candidates:
              raise SystemExit('ERREUR : aucun ZIP MUS-001_vNNN.zip trouve a la racine du depot.')
          latest = max(number for number, _ in candidates)
          matches = [path for number, path in candidates if number == latest]
          if len(matches) != 1:
              raise SystemExit(f'ERREUR : plusieurs ZIP pour la version v{latest:03d}: {matches}')
          archive = matches[0]
          print(f'Publication : {archive.name}')

          output = Path('_site')
          output.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir() and not i.filename.startswith('__MACOSX/') and Path(i.filename).name != '.DS_Store']
              if not entries:
                  raise SystemExit('ERREUR : archive vide.')
              # Reject absolute paths, parent traversal, symlinks and duplicate output paths.
              paths = []
              for i in entries:
                  p = Path(i.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in i.filename or ':' in i.filename:
                      raise SystemExit(f'ERREUR : chemin non autorise : {i.filename}')
                  if (i.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'ERREUR : lien symbolique interdit : {i.filename}')
                  paths.append(p)
              if not any(p.name == 'index.html' for p in paths):
                  raise SystemExit('ERREUR : index.html absent du ZIP.')
              # Accept index.html at root or within one single top-level directory.
              if Path('index.html') in paths:
                  strip = None
              else:
                  roots = {p.parts[0] for p in paths}
                  if len(roots) != 1 or len(next(iter(roots))) == 0:
                      raise SystemExit('ERREUR : placer index.html a la racine ou dans un dossier unique.')
                  strip = next(iter(roots))
                  if Path(strip, 'index.html') not in paths:
                      raise SystemExit('ERREUR : index.html doit etre a la racine du dossier unique.')
              seen = set()
              for info, path in zip(entries, paths):
                  relative = Path(*path.parts[1:]) if strip else path
                  if not relative.parts or relative in seen:
                      raise SystemExit(f'ERREUR : fichier duplique ou invalide : {path}')
                  seen.add(relative)
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as source, destination.open('wb') as target:
                      shutil.copyfileobj(source, target)
          print(f'Site pret : {len(seen)} fichiers, version v{latest:03d}')
          PY

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers a publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
